<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdfba" />
      <stop offset="100%" stop-color="#f5c292" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Circular Background -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="184" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  
  <!-- Subtle Grid/Code background lines -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="100" x2="140" y2="100" />
    <line x1="80" y1="120" x2="180" y2="120" />
    <line x1="260" y1="90" x2="340" y2="90" />
    <line x1="280" y1="110" x2="320" y2="110" />
    <line x1="50" y1="280" x2="120" y2="280" />
    <line x1="280" y1="280" x2="350" y2="280" />
  </g>

  <!-- Body / Shoulders -->
  <path d="M 90 380 C 100 300, 150 270, 200 270 C 250 270, 300 300, 310 380 Z" fill="url(#shirtGrad)" />
  <!-- Collar / Shirt Detail -->
  <path d="M 170 272 L 200 315 L 230 272 Z" fill="#3b82f6" opacity="0.8" />
  <path d="M 185 272 L 200 300 L 215 272 Z" fill="#ffffff" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="58" rx="8" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="65" ry="75" fill="url(#skinGrad)" filter="url(#cardShadow)" />

  <!-- Ears -->
  <circle cx="135" cy="180" r="14" fill="url(#skinGrad)" />
  <circle cx="265" cy="180" r="14" fill="url(#skinGrad)" />

  <!-- Modern Hair Style -->
  <path d="M 132 170 C 130 115, 170 100, 205 100 C 245 100, 272 120, 268 170 C 258 145, 235 130, 200 132 C 165 134, 142 148, 132 170 Z" fill="#1e1b4b" />
  <path d="M 140 135 C 170 105, 240 105, 262 135 C 245 125, 215 122, 190 125 C 165 128, 150 130, 140 135 Z" fill="#312e81" />

  <!-- Glasses -->
  <rect x="150" y="165" width="38" height="26" rx="6" fill="rgba(255,255,255,0.2)" stroke="#1e1b4b" stroke-width="4" />
  <rect x="212" y="165" width="38" height="26" rx="6" fill="rgba(255,255,255,0.2)" stroke="#1e1b4b" stroke-width="4" />
  <line x1="188" y1="178" x2="212" y2="178" stroke="#1e1b4b" stroke-width="4" />
  <line x1="135" y1="175" x2="150" y2="175" stroke="#1e1b4b" stroke-width="3" />
  <line x1="250" y1="175" x2="265" y2="175" stroke="#1e1b4b" stroke-width="3" />

  <!-- Eyes -->
  <circle cx="169" cy="178" r="4.5" fill="#1e1b4b" />
  <circle cx="231" cy="178" r="4.5" fill="#1e1b4b" />
  <circle cx="171" cy="176" r="1.5" fill="#ffffff" />
  <circle cx="233" cy="176" r="1.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M 152 155 Q 168 150 184 156" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 216 156 Q 232 150 248 155" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 200 180 L 196 198 L 204 198" fill="none" stroke="#e09f67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Smile -->
  <path d="M 184 214 Q 200 228 216 214" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" />

  <!-- Laptop / Developer Element at Bottom -->
  <g transform="translate(130, 310)">
    <rect x="0" y="25" width="140" height="12" rx="4" fill="#64748b" />
    <polygon points="15,25 125,25 115,2 25,2" fill="#94a3b8" />
    <rect x="28" y="5" width="84" height="17" rx="2" fill="#0f172a" />
    <!-- Code logo on screen -->
    <path d="M 64 12 L 60 14 L 64 16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 76 12 L 80 14 L 76 16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="72" y1="11" x2="68" y2="17" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>